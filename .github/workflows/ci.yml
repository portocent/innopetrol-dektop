# Tests and executables for Windows, Linux and macOS.
# Every push runs the tests on the three systems; the executables are uploaded as artifacts
# that can be downloaded from the GitHub "Actions" tab.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync
      - run: uv run pytest -v

  build:
    name: Executable (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --group build
      - run: uv run --group build python packaging/build.py

      # Checks that the packaged executable starts, opens a LAS file and draws it.
      - name: Test executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\InnoPetrol\InnoPetrol.exe -ArgumentList '--smoke-test', "$PWD\samples\Testdata.las" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke-test failed with exit code $($p.ExitCode)" }
      - name: Test executable (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/InnoPetrol/InnoPetrol --smoke-test "$PWD/samples/Testdata.las"
      - name: Test executable (macOS)
        if: runner.os == 'macOS'
        run: ./dist/InnoPetrol.app/Contents/MacOS/InnoPetrol --smoke-test "$PWD/samples/Testdata.las"

      - uses: actions/upload-artifact@v4
        with:
          name: InnoPetrol-${{ runner.os }}
          path: dist/*.zip
