# Tests and executables for Windows, Linux and macOS.
# Every push runs the tests on the three systems; the executables are uploaded as artifacts
# that can be downloaded from the GitHub "Actions" tab.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync
      - run: uv run pytest -v --cov --cov-report=term-missing:skip-covered

  build:
    name: Executable (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Inno Setup for the Windows installer
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - run: uv sync --group build
      - run: uv run --group build python packaging/build.py

      # Checks what users download: installs or unpacks it, then the program must start, open a LAS
      # file and draw it.
      - name: Test installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-windows-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "the installer was not built" }
          $dir = "$env:RUNNER_TEMP\InnoPetrol-test"
          Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', "/DIR=$dir" -Wait
          $p = Start-Process -FilePath "$dir\InnoPetrol.exe" -ArgumentList '--smoke-test', "$PWD\samples\Testdata.las" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke-test failed with exit code $($p.ExitCode)" }
      - name: Test archive (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          test -x "$RUNNER_TEMP/unpacked/InnoPetrol/install.sh"
          "$RUNNER_TEMP/unpacked/InnoPetrol/InnoPetrol" --smoke-test "$PWD/samples/Testdata.las"
      - name: Test disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          # hdiutil sometimes fails with "Resource busy" on the hosted runners: try a few times.
          for attempt in 1 2 3 4 5; do
            hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg && break
            echo "hdiutil attach failed (attempt $attempt), retrying…"; sleep 10
          done
          "$RUNNER_TEMP/dmg/InnoPetrol.app/Contents/MacOS/InnoPetrol" --smoke-test "$PWD/samples/Testdata.las"
          hdiutil detach "$RUNNER_TEMP/dmg" || hdiutil detach -force "$RUNNER_TEMP/dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: InnoPetrol-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/*-setup.exe
