# Weekly run over ~1500 real LAS files from the Kansas Geological Survey archive (downloaded, never
# stored in the repository). It does not run on every push: the download takes time and the data
# changes rarely. The report is uploaded as an artifact.
name: Real data

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  realdata:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: ~/.cache/innopetrol/kgs
          key: kgs-2001-2005
      - run: uv run python tools/realdata.py --report realdata-report.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realdata-report
          path: realdata-report.csv
