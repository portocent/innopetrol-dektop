# Checks run before every commit:  uv run pre-commit install  (once per clone)
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: translations
        name: translations compiled (.po -> .mo)
        entry: uv run python tools/i18n.py compile
        language: system
        files: \.po$
        pass_filenames: false
