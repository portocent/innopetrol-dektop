[project]
name = "innopetrol"
version = "2.0.0"
description = "Visor de registros de pozo (LAS) para ingenieros de petróleo"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jacobo Porto" }]
# pyside6-essentials: sólo los módulos de Qt que se usan (el paquete pyside6 completo pesa ~1 GB).
dependencies = [
    "pyside6-essentials>=6.7",
    "lasio>=0.31",
    "numpy>=1.26",
]

# gui-scripts: en Windows el lanzador no abre una consola negra junto a la aplicación.
[project.gui-scripts]
innopetrol = "innopetrol.__main__:main"

[dependency-groups]
build = ["pyinstaller>=6.10", "pillow>=10"]
dev = [
    "babel>=2.14",
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["innopetrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
timeout = 120
